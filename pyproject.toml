[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeta-scheduler"
version = "2.0.0"
description = "Constraint-preserving XY-mixer QAOA vs penalty-based Soft-QUBO for HPC load balancing - rebuilt, verified benchmark"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
